# Non-inferable metadata for MasterCompiler --scan
# Auto-merged when present at the scan root (or pass --base <file>).
# Include only what scan cannot discover from sources:
#   - objects with no source member (BNDDIR, DTAARA, DTAQ, MSGF)
#   - CRTCMD PGM (not valid on CMD definition source)
#   - hooks (AddBndDirE, OvrDbf, DltOvr, ADDMSGD)
#   - global defaults

defaults:
  TGTRLS: CURRENT
  DBGVIEW: ALL
  OPTION: EVENTF
  REPLACE: YES
  TGTCCSID: JOB

targets:

  # --- objects with no source (base-only targets) ---

  curlib.SAMPLE.bnddir.bnddir: {}

  curlib.LASTORDNO.dtaara.dtaara:
    params:
      Type: Dec
      LEN: 6 0
      VALUE: 60719
      TEXT: Last customer Order

  curlib.STREAMDTA.dtaq.dtaq:
    params:
      MAXLEN: 64512
      SIZE: MAX2GB
      AUTORCL: yes
      TEXT: Stream Text Dta

  curlib.SGSMSGF.msgf.msgf:
    params:
      CCSID: 65535
    after:
      - ADDMSGD:
          MSGID: ERR0001
          MSGF: SGSMSGF
          MSG: Familly code unknown. Press F4 to select.
          SEV: 0
          CCSID: 297
      - ADDMSGD:
          MSGID: ERR0002
          MSGF: SGSMSGF
          MSG: Country code unknown. Press F4 to select.
          SEV: 0
          CCSID: 297
      - ADDMSGD:
          MSGID: ERR0003
          MSGF: SGSMSGF
          MSG: Article code unknown. Press F4 to select.
          SEV: 0
          CCSID: 297
      - ADDMSGD:
          MSGID: ERR0004
          MSGF: SGSMSGF
          MSG: Customer code unknown. Press F4 to select.
          SEV: 0
          CCSID: 297
      - ADDMSGD:
          MSGID: ERR0005
          MSGF: SGSMSGF
          MSG: Provider code unknown. Press F4 to select.
          SEV: 0
          CCSID: 297
      - ADDMSGD:
          MSGID: ERR1001
          MSGF: SGSMSGF
          MSG: Delivered quantity must be lower or equal to ordered quantity.
          SEV: 0
          CCSID: 297
      - ADDMSGD:
          MSGID: ERR1002
          MSGF: SGSMSGF
          MSG: Ordered quantity can not be lower that the quantity already delivered
          SEV: 0
          CCSID: 297

  # --- CMD processing programs (CRTCMD requires PGM) ---

  curlib.CRTORD.CMD.cmd:
    params:
      PGM: ORD100

  curlib.CVTSPLPDF.CMD.cmd:
    params:
      PGM: CVTSPLPDF

  # --- hooks on scanned programs ---

  curlib.ART200.pgm.sqlrpgle:
    before:
      AddBndDirE:
        BndDir: SAMPLE
        Obj: FFAMILLY

  curlib.ART201.pgm.rpgle:
    before:
      AddBndDirE:
        BndDir: SAMPLE
        Obj:
          - FARTICLE
          - FPROVIDER

  curlib.ORD100.PGM.RPGLE:
    before:
      OvrDbf:
        File: tmpdetord
        ToFile: detord
        OvrScope: Job
      AddBndDirE:
        BndDir: SAMPLE
        Obj:
          - fvat
          - FCUSTOMER
    after:
      DltOvr:
        File: tmpdetord
        LVL: Job

  # LOG *SRVPGM (LOG300) exports ADDLOGENTRY — required by ORD700 via BNDDIR(SAMPLE)
  # (from IBM/tobi-example SAMPLE.BNDDIR entry *LIBL/LOG)
  curlib.LOG.srvpgm.bnd:
    params:
      MODULE: LOG300
      TEXT: Log Functions

  curlib.ORD700.PGM.RPGLE:
    before:
      AddBndDirE:
        BndDir: SAMPLE
        Obj: LOG
